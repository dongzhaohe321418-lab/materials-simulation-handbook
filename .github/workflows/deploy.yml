name: Deploy MkDocs site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Opt every JavaScript-based action into the Node 24 runtime. GitHub is
# deprecating the Node 20 runtime (forced default from June 2026, removed
# September 2026); setting this now keeps the workflow green through the
# transition without waiting for each action to ship a Node 24 release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Cairo for social-card image rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "mkdocs-material[imaging]" pillow cairosvg
          pip install -r requirements-lite.txt

      - name: Build MkDocs site
        run: mkdocs build --strict --verbose

      - name: Build JupyterLite site
        run: |
          jupyter lite build \
            --contents notebooks \
            --output-dir _output/lite

      - name: Merge JupyterLite into site/lite
        run: |
          mkdir -p site/lite
          cp -R _output/lite/. site/lite/
          ls -la site/lite/ | head

      - name: Upload artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy scipy matplotlib
      - name: Run pytest
        run: python -m pytest tests/ -x --tb=short

  deploy:
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
